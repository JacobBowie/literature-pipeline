name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies (Python ${{ matrix.python-version }})
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Compile-check every script
        shell: bash
        run: |
          find . -maxdepth 1 -name '*.py' -print0 | xargs -0 uv run python -m py_compile

      - name: Smoke-test --help on every CLI
        shell: bash
        run: |
          set -e
          # ris_emit.py is the only pure library (no __main__); every other
          # top-level .py exposes --help and must exit 0.
          for f in $(find . -maxdepth 1 -name '*.py' -not -name 'ris_emit.py'); do
            echo "--- $f --help"
            uv run python "$f" --help > /dev/null
          done

      - name: Run pytest
        run: uv run pytest tests/ -v
